<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#050716; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <style>
    .glow-title { font-size:32px; font-weight:800; fill:#ffffff; text-anchor:middle; letter-spacing:4px; filter:drop-shadow(0 0 12px rgba(0,240,255,0.8)); }
    .subtitle { font-size:14px; fill:#00f0ff; text-anchor:middle; letter-spacing:2px; font-family:monospace; }
    .tags { font-size:11px; fill:#a0a5c0; text-anchor:middle; letter-spacing:3px; }
    .stat-val { font-size:36px; font-weight:900; fill:#00f0ff; text-anchor:middle; }
    .stat-lbl { font-size:11px; font-weight:700; fill:#7a82a6; text-anchor:middle; letter-spacing:1.5px; }
    .card { fill:#0b0f28; stroke:#1a2350; stroke-width:1.5; rx:12px; }
    .card-title { font-size:15px; font-weight:800; fill:#ffffff; }
    .card-stack { font-size:12px; fill:#00f0ff; font-weight:600; }
    .card-desc { font-size:12px; fill:#8f98c2; }
    .orbit-line { fill:none; stroke:#1e295d; stroke-width:1.5; stroke-dasharray:4 4; }
  </style>

  <!-- HEADER -->
  <text x="500" y="70" class="glow-title">TLHOHONOLOFATSO QOANE</text>
  <text x="500" y="105" class="subtitle">&gt; Architecting the Future of Code_</text>
  <text x="500" y="135" class="tags">• CODE CRAFTSMAN • AI INNOVATOR • SYSTEMS ARCHITECT •</text>

  <!-- TECH STACK GALAXY -->
  <g transform="translate(500, 230)">
    <text x="0" y="-85" font-size="12" fill="#7000ff" font-weight="800" text-anchor="middle" letter-spacing="3">STACK GALAXY</text>
    <ellipse cx="0" cy="0" rx="260" ry="80" class="orbit-line"/>
    <ellipse cx="0" cy="0" rx="170" ry="50" class="orbit-line"/>
    <circle cx="0" cy="0" r="32" fill="#050716" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">CORE</text>

    <!-- Orbit Node 1 -->
    <g transform="translate(-180, -40)">
      <circle cx="0" cy="0" r="18" fill="#050716" stroke="#7000ff" stroke-width="2"/>
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Python</text>
    </g>
    <!-- Orbit Node 2 -->
    <g transform="translate(140, 30)">
      <circle cx="0" cy="0" r="18" fill="#050716" stroke="#ff007a" stroke-width="2"/>
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">C++</text>
    </g>
    <!-- Orbit Node 3 -->
    <g transform="translate(120, -35)">
      <circle cx="0" cy="0" r="18" fill="#050716" stroke="#00f0ff" stroke-width="2"/>
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">TS</text>
    </g>
  </g>

  <line x1="100" y1="340" x2="900" y2="340" stroke="#101738" stroke-width="2"/>

  <!-- METRICS -->
  <text x="500" y="370" font-size="12" fill="#7000ff" font-weight="800" text-anchor="middle" letter-spacing="3">PERFORMANCE METRICS</text>
  <g transform="translate(0, 390)">
    <g transform="translate(200, 0)">
      <text x="0" y="35" class="stat-val">0</text>
      <text x="0" y="55" class="stat-lbl">STARS</text>
    </g>
    <g transform="translate(400, 0)">
      <text x="0" y="35" class="stat-val">10</text>
      <text x="0" y="55" class="stat-lbl">REPOS</text>
    </g>
    <g transform="translate(600, 0)">
      <text x="0" y="35" class="stat-val">49</text>
      <text x="0" y="55" class="stat-lbl">COMMITS</text>
    </g>
    <g transform="translate(800, 0)">
      <text x="0" y="35" class="stat-val">59</text>
      <text x="0" y="55" class="stat-lbl">CONTRIBUTIONS</text>
    </g>
  </g>

  <!-- FEATURED PROJECTS -->
  <g transform="translate(75, 480)">
    <rect class="card" width="260" height="130" x="0" y="0"/>
    <text x="20" y="35" class="card-title">KEORAPETSEQ</text>
    <text x="20" y="58" class="card-stack">Code</text>
    <text x="20" y="82" class="card-desc">No description provided.</text>
  </g>

  <g transform="translate(370, 480)">
    <rect class="card" width="260" height="130" x="0" y="0"/>
    <text x="20" y="35" class="card-title">INMODE</text>
    <text x="20" y="58" class="card-stack">TypeScript • PLpgSQL • CSS</text>
    <text x="20" y="82" class="card-desc">No description provided.</text>
  </g>

  <g transform="translate(665, 480)">
    <rect class="card" width="260" height="130" x="0" y="0"/>
    <text x="20" y="35" class="card-title">MY-PORTFOLIO</text>
    <text x="20" y="58" class="card-stack">CSS • JavaScript • HTML</text>
    <text x="20" y="82" class="card-desc">No description provided.</text>
  </g>
</svg>
