<svg fill="none" width="900" height="750" viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 5px #00f0ff); }
        50% { filter: drop-shadow(0 0 15px #7000ff); }
      }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .bg { fill: #050714; rx: 16px; }
      .glowing-bg { transform-origin: center; animation: pulse 6s ease-in-out infinite; }
      .header-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 900; font-size: 34px; fill: #ffffff; text-anchor: middle; letter-spacing: 5px; animation: glow 4s infinite; }
      .header-sub { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 500; font-size: 15px; fill: #00f0ff; text-anchor: middle; letter-spacing: 2px; }
      .accent-text { font-family: monospace; font-size: 12px; fill: #a0a5c0; text-anchor: middle; }
      .section-label { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; font-weight: 700; fill: #7000ff; letter-spacing: 2.5px; text-anchor: middle; }
      
      .stat-val { font-family: sans-serif; font-size: 26px; font-weight: 800; fill: #00f0ff; text-anchor: middle; }
      .stat-lbl { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #8a8fb2; text-anchor: middle; letter-spacing: 1px; }

      .card-bg { fill: #0c0f28; stroke: #1e244d; stroke-width: 1.5; rx: 12px; }
      .floating-card { animation: float 5s ease-in-out infinite; }
      .orbiting-group { transform-origin: 450px 290px; animation: orbit 25s linear infinite; }
    </style>

    <!-- Radial Gradients for Deep Space Glows -->
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Animated Cosmic Backgrounds -->
  <circle class="glowing-bg" cx="450" cy="180" r="280" fill="url(#nebula1)" />
  <circle class="glowing-bg" cx="450" cy="300" r="220" fill="url(#nebula2)" style="animation-delay: -3s;" />

  <!-- Header Section -->
  <g transform="translate(0, 60)">
    <text x="450" y="0" class="header-title">TLHOHONOLOFATSO QOANE</text>
    <text x="450" y="30" class="header-sub">&gt; Architecting the Future of Code_</text>
    <text x="450" y="58" class="accent-text">• CODE CRAFTSMAN • AI INNOVATOR • SYSTEMS ARCHITECT •</text>
  </g>

  <!-- Stack Galaxy Center (Interactive Core) -->
  <g transform="translate(0, 20)">
    <text x="450" y="180" class="section-label">STACK GALAXY</text>
    
    <!-- Central Core -->
    <circle cx="450" cy="290" r="32" fill="#121638" stroke="#00f0ff" stroke-width="2" class="floating-card"/>
    <text x="450" y="295" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">CORE</text>

    <!-- Orbit Rings -->
    <ellipse cx="450" cy="290" rx="140" ry="60" fill="none" stroke="#1f2653" stroke-width="1.5" stroke-dasharray="4 4"/>
    <ellipse cx="450" cy="290" rx="220" ry="90" fill="none" stroke="#1b2046" stroke-width="1.5"/>

    <!-- Orbiting Tech Elements -->
    <g class="orbiting-group">
      <circle cx="310" cy="290" r="16" fill="#0d112d" stroke="#7000ff" stroke-width="1.5"/>
      <text x="310" y="294" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Python</text>

      <circle cx="590" cy="290" r="16" fill="#0d112d" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="590" y="294" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">TS</text>

      <circle cx="450" cy="200" r="16" fill="#0d112d" stroke="#ff007a" stroke-width="1.5"/>
      <text x="450" y="204" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">C++</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="80" y1="420" x2="820" y2="420" stroke="#1a1e43" stroke-width="1.5"/>

  <!-- Performance Metrics -->
  <g transform="translate(0, 440)">
    <text x="450" y="15" class="section-label">PERFORMANCE METRICS</text>
    
    <g transform="translate(130, 35)">
      <text x="0" y="20" class="stat-val">0</text>
      <text x="0" y="38" class="stat-lbl">STARS</text>
    </g>
    <g transform="translate(310, 35)">
      >10<</text>
      <text x="0" y="38" class="stat-lbl">REPOS</text>
    </g>
    <g transform="translate(490, 35)">
      <text x="0" y="20" class="stat-val>34<lass="stat-lbl">COMMITS</text>
    </g>
    <g transform="translate(670, 35)">
      <text x="0" y="20" class="stat-val">3,200</text>
      <text x="0" y="38" class="stat-lbl">CONTRIBUTIONS</text>
    </g>
  </g>

  <!-- Primary Deployments / Projects -->
  <g transform="translate(50, 540)">
    <!-- Project 1 -->
    <g class="floating-card" style="animation-delay: 0s;">
      <rect class="card-bg" x="0" y="0" width="250" height="130"/>
      <text x="20" y="35" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">MED-AI CO-PILOT</text>
      <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#00f0ff">Python • TensorFlow • React</text>
      <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#8a8fb2">Next-gen medical diagnostic assistant.</text>
      <text x="230" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00ff88" text-anchor="end">Deployed</text>
    </g>

    <!-- Project 2 -->
    <g class="floating-card" style="animation-delay: -1.5s;">
      <rect class="card-bg" x="275" y="0" width="250" height="130"/>
      <text x="295" y="35" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">QUANTUM BLOCKCHAIN</text>
      <text x="295" y="55" font-family="sans-serif" font-size="11" fill="#7000ff">Go • Rust • IPFS</text>
      <text x="295" y="80" font-family="sans-serif" font-size="11" fill="#8a8fb2">Secure decentralized ledger tech.</text>
      <text x="505" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffca28" text-anchor="end">Beta</text>
    </g>

    <!-- Project 3 -->
    <g class="floating-card" style="animation-delay: -3s;">
      <rect class="card-bg" x="550" y="0" width="250" height="130"/>
      <text x="570" y="35" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">GREEN IOT GRID</text>
      <text x="570" y="55" font-family="sans-serif" font-size="11" fill="#00f0ff">Kubernetes • MQTT • Go</text>
      <text x="570" y="80" font-family="sans-serif" font-size="11" fill="#8a8fb2">Smart energy management grid.</text>
      <text x="780" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00f0ff" text-anchor="end">Development</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="450" y="715" font-family="monospace" font-size="11" fill="#44496d" text-anchor="middle">Tlhohonolofatso Qoane | KeorapetseQ</text>
</svg>
